<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>翻译集合 · OTools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='24' font-size='24'%3E%F0%9F%8C%90%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    /*
     * OTools 宿主桥（沿用 snake 模板契约，按需适配）。
     * ------------------------------------------------------------------
     * 宿主注入了两条能力通道，任一条通就算「在 OTools 里」：
     *   1. `window.otools` / `window.utools`：宿主包装 API。
     *   2. `window.__TAURI_INTERNALS__.invoke`：Tauri 原生 IPC（tools_webview_* 命令）。
     * 两条都不通（把 dist 拖进普通浏览器）就退回浏览器原生行为。
     *
     * 翻译集合不需要宿主文件 I/O（站点开关配置存 localStorage），这里保留完整的桥
     * 契约（openText/saveText 等方法原样保留），本插件用到：
     *   - available()：判断是否在宿主 webview 里（决定 DeepL/Google 特殊站的跳转方式与提示文案）。
     *   - theme()/language()：宿主主题与语言（本插件固定深色中文 UI）。
     *   - 系统浏览器打开（Task 2 spike 落地）：三级 openExternal 链
     *     window.otools?.shell?.openExternal → window.otools?.shellOpenExternal
     *     → __TAURI_INTERNALS__.invoke('otools_shell_open_external') → window.open 兜底。
     */
    (function () {
      function base64ToBytes(b64) {
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }
      function bytesToBase64(bytes) {
        var bin = '';
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
      }
      function baseName(p) {
        var s = String(p || '');
        var i = Math.max(s.lastIndexOf('/'), s.lastIndexOf('\\'));
        return i >= 0 ? s.slice(i + 1) : s;
      }

      function wrapper() {
        var a = (typeof window !== 'undefined' && (window.otools || window.utools)) || null;
        return a && a.dialog && typeof a.dialog.open === 'function' && typeof a.readHostFile === 'function' ? a : null;
      }
      function tauriInvoke() {
        var candidates = [window];
        try { if (window.parent && window.parent !== window) candidates.push(window.parent); } catch (e) {}
        try { if (window.top && window.top !== window) candidates.push(window.top); } catch (e) {}
        for (var i = 0; i < candidates.length; i++) {
          var t = candidates[i] && candidates[i].__TAURI_INTERNALS__;
          if (t && typeof t.invoke === 'function') return t.invoke.bind(t);
        }
        return null;
      }
      function hostReady() { return !!wrapper() || !!tauriInvoke(); }
      function fail(msg) { return Promise.reject(new Error(msg)); }

      function readHostFile(path) {
        var a = wrapper();
        if (a) return a.readHostFile(path);
        var invoke = tauriInvoke();
        if (!invoke) return fail('OTools 宿主不可用');
        return invoke('tools_webview_read_file', { path: path });
      }
      function writeHostFile(path, dataBase64) {
        var invoke = tauriInvoke();
        if (invoke) {
          return invoke('tools_webview_write_file', { request: { path: path, dataBase64: dataBase64 } }).catch(function (e) {
            var a = wrapper();
            if (a && typeof a.writeHostFile === 'function') return a.writeHostFile({ path: path, dataBase64: dataBase64 });
            throw e;
          });
        }
        var a = wrapper();
        if (a && typeof a.writeHostFile === 'function') return a.writeHostFile({ path: path, dataBase64: dataBase64 });
        return fail('OTools 宿主不可用');
      }
      function pickOpenPath(filters) {
        var a = wrapper();
        if (a) return a.dialog.open({ directory: false, multiple: false, title: '打开文件', filters: filters }).then(function (p) {
          return (p && typeof p === 'string') ? p : (p && p.path ? p.path : null);
        });
        var invoke = tauriInvoke();
        if (!invoke) return fail('OTools 打开文件对话框不可用');
        return invoke('tools_webview_pick_files', { options: { multiple: false, title: '打开文件', filters: filters } }).then(function (files) {
          var list = Array.isArray(files) ? files : (files ? [files] : []);
          var first = list[0];
          return first ? (typeof first === 'string' ? first : (first.path || null)) : null;
        });
      }
      function pickSavePath(defaultPath) {
        var a = wrapper();
        if (a) return a.dialog.save({ title: '保存文件', defaultPath: defaultPath, filters: [{ name: '文本', extensions: ['txt'] }] }).then(function (p) {
          return (p && typeof p === 'string') ? p : (p && p.path ? p.path : null);
        });
        var invoke = tauriInvoke();
        if (!invoke) return fail('OTools 保存对话框不可用');
        var sp = String(defaultPath || '').match(/^(.*[\\/])?([^\\/]+)$/);
        return invoke('tools_webview_pick_save_path', {
          options: { title: '保存文件', suggestedName: sp ? sp[2] : defaultPath, directory: sp ? sp[1].replace(/[\\/]+$/, '') : undefined, filters: [{ name: '文本', extensions: ['txt'] }] },
        }).then(function (meta) { return meta ? (typeof meta === 'string' ? meta : (meta.path || null)) : null; });
      }

      // 暴露给页面其它脚本的统一桥。
      window.otoolsPlugin = {
        available: function () { return hostReady(); },
        theme: function () {
          var cl = document.documentElement && document.documentElement.classList;
          if (!cl) return '';
          if (cl.contains('dark')) return 'dark';
          if (cl.contains('light')) return 'light';
          return '';
        },
        language: function () {
          try {
            return (window.__OTOOLS_LOCALE__ && window.__OTOOLS_LOCALE__.locale) ||
              (document.documentElement && document.documentElement.lang) ||
              (typeof navigator !== 'undefined' && navigator.language) || '';
          } catch (e) { return ''; }
        },
        openText: function (filters) {
          if (!hostReady()) return fail('OTools 打开文件对话框不可用');
          return pickOpenPath(filters || [{ name: '文本', extensions: ['txt', 'json', 'md'] }]).then(function (path) {
            if (!path) return null;
            return readHostFile(path).then(function (file) {
              var dataBase64 = (file && file.dataBase64) || '';
              return { name: (file && file.name) || baseName(path), path: path, text: atob(dataBase64) };
            });
          });
        },
        saveText: function (name, text) {
          if (!hostReady()) return fail('OTools 保存对话框不可用');
          return pickSavePath(name).then(function (path) {
            if (!path) return null;
            return writeHostFile(path, bytesToBase64(new TextEncoder().encode(text))).then(function () { return path; });
          });
        },
      };
    })();
  </script>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="brand">
        <h1>🌐 翻译集合</h1>
        <span class="brand-sub">Spike · 宿主内嵌与浏览器跳转验证（Task 2）</span>
      </div>
      <button id="btn-test-open" type="button" class="btn-test">测试系统浏览器打开</button>
    </header>

    <div id="spike-status" class="spike-status">
      尚未探测。点击「测试系统浏览器打开」探测宿主能力并拉起 https://example.com。
    </div>

    <main class="spike-grid">
      <section class="spike-panel">
        <div class="spike-panel-head">
          <strong>百度翻译</strong>
          <span>https://fanyi.baidu.com · 302 链路曾有 deny：观察最终页是否渲染、可输入翻译、有无验证码死循环</span>
        </div>
        <iframe src="https://fanyi.baidu.com" title="百度翻译（spike 左列）"></iframe>
      </section>
      <section class="spike-panel">
        <div class="spike-panel-head">
          <strong>必应翻译</strong>
          <span>https://cn.bing.com/translator · 最干净 200：观察是否渲染且可交互</span>
        </div>
        <iframe src="https://cn.bing.com/translator" title="必应翻译（spike 右列）"></iframe>
      </section>
    </main>
  </div>

  <script type="module">
    import { pickOpenStrategy } from './js/core/host.js';

    var OPEN_URL = 'https://example.com';
    var statusEl = document.getElementById('spike-status');
    var btn = document.getElementById('btn-test-open');

    // 与 head 桥 IIFE 的 tauriInvoke 同款探测：window → parent → top 逐层找 __TAURI_INTERNALS__.invoke。
    function findTauriInvoke() {
      var candidates = [window];
      try { if (window.parent && window.parent !== window) candidates.push(window.parent); } catch (e) {}
      try { if (window.top && window.top !== window) candidates.push(window.top); } catch (e) {}
      for (var i = 0; i < candidates.length; i++) {
        var t = candidates[i] && candidates[i].__TAURI_INTERNALS__;
        if (t && typeof t.invoke === 'function') return t.invoke.bind(t);
      }
      return null;
    }

    function detectFlags() {
      return {
        hasSdkShell: !!(window.otools && window.otools.shell && typeof window.otools.shell.openExternal === 'function'),
        hasSdkFlat: !!(window.otools && typeof window.otools.shellOpenExternal === 'function'),
        hasTauriInvoke: !!findTauriInvoke(),
      };
    }

    function flagsText(flags) {
      var bridgeAvail = 'n/a';
      try {
        if (window.otoolsPlugin && typeof window.otoolsPlugin.available === 'function') {
          bridgeAvail = String(window.otoolsPlugin.available());
        }
      } catch (e) {}
      return 'shell=' + (flags.hasSdkShell ? '✓' : '✗')
        + ' flat=' + (flags.hasSdkFlat ? '✓' : '✗')
        + ' tauri=' + (flags.hasTauriInvoke ? '✓' : '✗')
        + ' 桥available=' + bridgeAvail;
    }

    // 按 pickOpenStrategy 结果排出实际尝试的级别序列（失败逐级降级）。
    function buildLevels(strategy, flags) {
      var levels = [];
      if (strategy === 'sdk') {
        if (flags.hasSdkShell) {
          levels.push({ name: 'sdk-shell', run: function () { return window.otools.shell.openExternal(OPEN_URL); } });
        }
        if (flags.hasSdkFlat) {
          levels.push({ name: 'sdk-flat', run: function () { return window.otools.shellOpenExternal(OPEN_URL); } });
        }
      }
      if (strategy === 'sdk' || strategy === 'tauri') {
        var invoke = findTauriInvoke();
        if (invoke) {
          levels.push({ name: 'tauri', run: function () { return invoke('otools_shell_open_external', { url: OPEN_URL }); } });
        }
      }
      levels.push({
        name: 'window',
        run: function () {
          var w = window.open(OPEN_URL, '_blank');
          if (!w) throw new Error('返回 null（可能被拦截）');
        },
      });
      return levels;
    }

    function render(text, cls) {
      statusEl.textContent = text;
      statusEl.className = 'spike-status' + (cls ? ' ' + cls : '');
    }

    btn.addEventListener('click', function () {
      btn.disabled = true;
      var flags = detectFlags();
      var strategy = pickOpenStrategy(flags);
      render('探测中… 命中策略=' + strategy + '（' + flagsText(flags) + '）');
      var trace = [];
      var levels = buildLevels(strategy, flags);
      var settled = false;
      var chain = Promise.resolve();
      levels.forEach(function (lvl) {
        chain = chain.then(function () {
          if (settled) return null;
          return Promise.resolve()
            .then(lvl.run)
            .then(function () {
              settled = true;
              trace.push(lvl.name + '成功');
            })
            .catch(function (e) {
              trace.push(lvl.name + '失败' + (e && e.message ? '（' + e.message + '）' : ''));
            });
        });
      });
      chain.then(function () {
        var head = '策略=' + strategy + '（' + flagsText(flags) + '）· ';
        if (settled) {
          render(head + '轨迹：' + trace.join('→'), 'ok');
        } else {
          render(head + '轨迹：' + trace.join('→') + ' —— 全部失败，请手动访问 ' + OPEN_URL, 'fail');
        }
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
